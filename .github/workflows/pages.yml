name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild when someone comments via Giscus, so the footer's recent comments stay current.
  discussion_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -qO hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
      - name: Fetch latest Giscus comments
        run: tools/fetch-giscus.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - id: pages
        uses: actions/configure-pages@v5
      # base_url is https://<user>.github.io/blog, or the custom domain once one is set.
      # No --minify: it would mangle the XML in feed/index.html.
      - run: hugo --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
